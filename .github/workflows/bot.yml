name: Execucao_Bot_Auditoria

on:
  schedule:
    - cron: '45 23 * * *' # Roda às 23:45 UTC
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  rodar_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v3

      - name: Configurar Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependencias do Motor
        run: |
          python -m pip install --upgrade pip
          # Instalando apenas o essencial para o bot rodar sem erros
          pip install pandas supabase xlsxwriter fpdf scikit-learn numpy matplotlib

      - name: Executar Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python worker_envio.py
