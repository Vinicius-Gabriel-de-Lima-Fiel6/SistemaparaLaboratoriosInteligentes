name: Bot_Auditoria_Agendada

on:
  schedule:
    - cron: '45 23 * * *' # 20:45 Brasília
  workflow_dispatch: 

jobs:
  disparo_agendado:
    runs-on: ubuntu-latest
    steps:
      - name: Baixando o Código
        uses: actions/checkout@v3

      - name: Instalando Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Instalando Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase xlsxwriter xhtml2pdf scikit-learn numpy jinja2 matplotlib

      - name: Executando o Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python worker_envio.py
