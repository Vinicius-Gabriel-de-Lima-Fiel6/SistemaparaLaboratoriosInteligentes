<div style="font-family: sans-serif; border: 1px solid #ddd; padding: 20px; border-radius: 10px;">
    <h2 style="color: #003366;">{{nome}}</h2>
    <p><strong>Concentração:</strong> {{concentracao}} | <strong>CAS:</strong> {{cas}}</p>
    <div class="hommel-container">
        <div class="hommel-box">
            <div class="f_vermelho">{{fogo}}</div>
            <div class="r_amarelo">{{reatividade}}</div>
            <div class="s_azul">{{saude}}</div>
            <div class="e_branco">{{especial}}</div>
        </div>
    </div>
    <div style="background: #fff4f4; padding: 15px; border-left: 5px solid #ff4b4b; margin-top: 20px;">
        <strong>⚠️ INSTRUÇÕES DE EMERGÊNCIA:</strong><br>
        {{instrucoes}}
    </div>
</div>
